<title>Mitsuketa — Intro Animation</title>
<style>
  :root {
    --ink: #0a0f1e;
    --ink-2: #0e1526;
    --line: #4a5b7d;
    --node: #d8dee9;
    --seal: #e04e39;
    --bone: #e8ebf2;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(120% 120% at 50% 42%, var(--ink-2) 0%, var(--ink) 62%, #060a14 100%);
    overflow: hidden;
    font-family: ui-sans-serif, "Segoe UI", "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: var(--bone);
  }
  .stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
  }
  svg.scene { width: 100%; height: 100%; display: block; }

  /* --- web --- */
  .edge {
    stroke: var(--line);
    stroke-width: 1.2;
    fill: none;
    opacity: 0.75;
  }
  .node { transform-box: fill-box; transform-origin: center; }

  /* --- magnifying glass --- */
  .glass { will-change: transform; }
  .glass-inner { animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  /* --- text reveal --- */
  .title-block {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    opacity: 0;
  }
  .title-block.show {
    animation: title-in 900ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes title-in {
    from { opacity: 0; transform: translate(-50%, -46%) scale(0.96); filter: blur(6px); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
  }
  .jp {
    font-size: clamp(1rem, 2.2vw, 1.4rem);
    letter-spacing: 0.55em;
    margin-left: 0.55em; /* optical: balance the tracking */
    color: var(--node);
    opacity: 0.85;
  }
  h1 {
    margin: 0.35rem 0 0;
    font-size: clamp(2.6rem, 8vw, 5.5rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--seal);
  }
  .tag {
    margin-top: 1rem;
    font-size: clamp(0.65rem, 1.1vw, 0.8rem);
    letter-spacing: 0.32em;
    margin-left: 0.32em;
    text-transform: uppercase;
    color: var(--line);
  }

  .replay {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    background: transparent;
    color: var(--node);
    border: 1px solid #2a3550;
    border-radius: 999px;
    padding: 10px 22px;
    font: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    opacity: 0;
    transition: opacity 400ms ease, border-color 200ms ease, color 200ms ease;
  }
  .replay.show { opacity: 1; }
  .replay:hover { border-color: var(--seal); color: var(--seal); }
  .replay:focus-visible { outline: 2px solid var(--seal); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .glass-inner { animation: none; }
    .title-block.show { animation: none; opacity: 1; }
  }
</style>

<div class="stage">
  <svg class="scene" id="scene" preserveAspectRatio="xMidYMid meet"></svg>
</div>

<div class="title-block" id="title">
  <div class="jp">見つけた</div>
  <h1>MITSUKETA</h1>
  <div class="tag">Corporate structure, found</div>
</div>

<button class="replay" id="replay" type="button">Replay</button>

<script>
const SVG = 'http://www.w3.org/2000/svg';
const scene = document.getElementById('scene');
const titleEl = document.getElementById('title');
const replayBtn = document.getElementById('replay');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const W = 1200, H = 800, CX = W / 2, CY = H / 2;
scene.setAttribute('viewBox', `0 0 ${W} ${H}`);

const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const el = (name, attrs) => {
  const n = document.createElementNS(SVG, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
};

/* ---------- graph generation (deterministic) ---------- */
// ponytail: seeded LCG so every replay draws the same web
let seed = 42;
const rand = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

function buildGraph() {
  const nodes = [{ x: CX, y: CY, r: 13, layer: 0, kind: 'seal' }];
  const layers = [
    { count: 6, radius: 120, r: [6.5, 9] },
    { count: 12, radius: 225, r: [4.5, 6.5] },
    { count: 14, radius: 330, r: [3, 4.5] },
  ];
  const edges = [];
  let prevStart = 0, prevCount = 1;

  layers.forEach((L, li) => {
    const start = nodes.length;
    for (let i = 0; i < L.count; i++) {
      const angle = (i / L.count) * Math.PI * 2 + rand() * 0.5 - 0.25 + li * 0.35;
      const radius = L.radius + (rand() - 0.5) * L.radius * 0.28;
      const x = CX + Math.cos(angle) * radius * 1.25; // widescreen stretch
      const y = CY + Math.sin(angle) * radius * 0.82;
      const kind = rand() < 0.3 ? 'person' : 'company';
      nodes.push({ x, y, r: L.r[0] + rand() * (L.r[1] - L.r[0]), layer: li + 1, kind });
      // connect to nearest node in previous layer
      let best = prevStart, bd = Infinity;
      for (let p = prevStart; p < prevStart + prevCount; p++) {
        const d = (nodes[p].x - x) ** 2 + (nodes[p].y - y) ** 2;
        if (d < bd) { bd = d; best = p; }
      }
      edges.push({ from: best, to: nodes.length - 1, layer: li + 1 });
    }
    // a few cross-links within the layer for "complex web" feel
    for (let i = 0; i < Math.floor(L.count / 4); i++) {
      const a = start + Math.floor(rand() * L.count);
      const b = start + Math.floor(rand() * L.count);
      if (a !== b) edges.push({ from: a, to: b, layer: li + 1, cross: true });
    }
    prevStart = start;
    prevCount = L.count;
  });
  return { nodes, edges };
}

/* ---------- scene construction ---------- */
let webGroup, glassGroup, rippleGroup;

function drawScene() {
  scene.innerHTML = '';
  seed = 42;
  const { nodes, edges } = buildGraph();

  webGroup = el('g', {});
  rippleGroup = el('g', {});
  scene.appendChild(webGroup);
  scene.appendChild(rippleGroup);

  // edges under nodes
  edges.forEach((e) => {
    const a = nodes[e.from], b = nodes[e.to];
    const mx = (a.x + b.x) / 2 + (rand() - 0.5) * 34;
    const my = (a.y + b.y) / 2 + (rand() - 0.5) * 34;
    const path = el('path', {
      class: 'edge',
      d: `M ${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}`,
      'stroke-dasharray': '1',
      'stroke-dashoffset': '1',
      'stroke-width': e.cross ? 0.8 : 1.2,
      opacity: e.cross ? 0.4 : 0.75,
      'data-layer': e.layer,
    });
    webGroup.appendChild(path);
    const L = path.getTotalLength();
    path.setAttribute('stroke-dasharray', L);
    path.setAttribute('stroke-dashoffset', L);
  });

  // nodes
  nodes.forEach((n, i) => {
    let shape;
    if (n.kind === 'seal') {
      shape = el('g', { class: 'node', 'data-layer': 0 });
      shape.appendChild(el('circle', { cx: n.x, cy: n.y, r: n.r, fill: 'var(--seal)' }));
      shape.appendChild(el('circle', { cx: n.x, cy: n.y, r: n.r + 6, fill: 'none', stroke: 'var(--seal)', 'stroke-width': 1.5, opacity: 0.5 }));
    } else if (n.kind === 'person') {
      shape = el('circle', { class: 'node', cx: n.x, cy: n.y, r: n.r, fill: 'none', stroke: 'var(--node)', 'stroke-width': 1.4, 'data-layer': n.layer, opacity: 0.9 });
    } else {
      shape = el('circle', { class: 'node', cx: n.x, cy: n.y, r: n.r, fill: 'var(--node)', 'data-layer': n.layer, opacity: 0.9 });
    }
    shape.style.transform = 'scale(0)';
    webGroup.appendChild(shape);
  });

  // magnifying glass
  glassGroup = el('g', { class: 'glass' });
  const inner = el('g', { class: 'glass-inner' });
  inner.appendChild(el('circle', { cx: 0, cy: 0, r: 36, fill: 'rgba(216,222,233,0.05)', stroke: 'var(--bone)', 'stroke-width': 3.5 }));
  inner.appendChild(el('path', { d: 'M -14 -20 A 26 26 0 0 1 12 -22', fill: 'none', stroke: 'var(--bone)', 'stroke-width': 2, 'stroke-linecap': 'round', opacity: 0.45 }));
  inner.appendChild(el('line', { x1: 26, y1: 26, x2: 56, y2: 56, stroke: 'var(--bone)', 'stroke-width': 7, 'stroke-linecap': 'round' }));
  glassGroup.appendChild(inner);
  glassGroup.style.transform = `translate(${CX - 280}px, ${CY - 130}px)`;
  scene.appendChild(glassGroup);
}

/* ---------- animation helpers ---------- */
function moveGlass(x, y, dur, easing = 'cubic-bezier(0.22, 1, 0.36, 1)') {
  const anim = glassGroup.animate(
    [{ transform: glassGroup.style.transform }, { transform: `translate(${x}px, ${y}px)` }],
    { duration: dur, easing, fill: 'forwards' }
  );
  glassGroup.style.transform = `translate(${x}px, ${y}px)`;
  return anim.finished;
}

function ripple(delay, maxR, dur, width, opacity) {
  const c = el('circle', { cx: CX, cy: CY, r: 8, fill: 'none', stroke: 'var(--seal)', 'stroke-width': width });
  rippleGroup.appendChild(c);
  c.animate(
    [
      { r: 8, opacity },
      { r: maxR, opacity: 0 },
    ],
    { duration: dur, delay, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'forwards' }
  ).finished.then(() => c.remove());
}

function revealWeb() {
  for (let layer = 0; layer <= 3; layer++) {
    const base = 120 + (layer - 1) * 420;
    webGroup.querySelectorAll(`.edge[data-layer="${layer}"]`).forEach((p, i) => {
      p.animate(
        [{ strokeDashoffset: p.getAttribute('stroke-dashoffset') }, { strokeDashoffset: 0 }],
        { duration: 650, delay: base + i * 28, easing: 'cubic-bezier(0.33, 1, 0.68, 1)', fill: 'forwards' }
      );
    });
    webGroup.querySelectorAll(`.node[data-layer="${layer}"]`).forEach((n, i) => {
      n.animate(
        [{ transform: 'scale(0)' }, { transform: 'scale(1)' }],
        { duration: 480, delay: (layer === 0 ? 0 : base + 220) + i * 30, easing: 'cubic-bezier(0.34, 1.2, 0.64, 1)', fill: 'forwards' }
      );
    });
  }
}

function finalState() {
  webGroup.querySelectorAll('.edge').forEach((p) => p.setAttribute('stroke-dashoffset', 0));
  webGroup.querySelectorAll('.node').forEach((n) => (n.style.transform = 'scale(1)'));
  glassGroup.style.opacity = 0;
  titleEl.classList.add('show');
  replayBtn.classList.add('show');
}

/* ---------- the sequence ---------- */
let running = false;
async function run() {
  if (running) return;
  running = true;
  titleEl.classList.remove('show');
  replayBtn.classList.remove('show');
  drawScene();

  if (reduced) { finalState(); running = false; return; }

  // 1. dart around, searching
  const spots = [
    [CX + 230, CY - 150],
    [CX - 180, CY + 120],
    [CX + 160, CY + 140],
    [CX - 260, CY - 60],
  ];
  await wait(500);
  for (const [x, y] of spots) {
    await moveGlass(x, y, 520);
    await wait(320); // pause, "inspecting"
  }

  // 2. glide to center and press: the imprint
  await moveGlass(CX, CY, 700, 'cubic-bezier(0.65, 0, 0.35, 1)');
  await wait(150);
  const press = glassGroup.animate(
    [
      { transform: `translate(${CX}px, ${CY}px) scale(1)` },
      { transform: `translate(${CX}px, ${CY}px) scale(0.86)`, offset: 0.4 },
      { transform: `translate(${CX}px, ${CY}px) scale(1)` },
    ],
    { duration: 420, easing: 'cubic-bezier(0.33, 1, 0.68, 1)' }
  );
  ripple(160, 90, 900, 2.5, 0.9);
  ripple(280, 170, 1100, 1.5, 0.6);
  ripple(400, 260, 1300, 1, 0.35);
  await press.finished;

  // 3. the web spreads from the imprint; the glass retires
  revealWeb();
  glassGroup.animate(
    [
      { opacity: 1, transform: `translate(${CX}px, ${CY}px) scale(1)` },
      { opacity: 0, transform: `translate(${CX}px, ${CY}px) scale(1.35)` },
    ],
    { duration: 800, delay: 300, easing: 'ease-out', fill: 'forwards' }
  );

  // 4. dim the web slightly, reveal the name
  await wait(1900);
  webGroup.animate([{ opacity: 1 }, { opacity: 0.35 }], {
    duration: 900,
    easing: 'ease-out',
    fill: 'forwards',
  });
  titleEl.classList.add('show');
  await wait(700);
  replayBtn.classList.add('show');
  running = false;
}

replayBtn.addEventListener('click', run);
run();
</script>
